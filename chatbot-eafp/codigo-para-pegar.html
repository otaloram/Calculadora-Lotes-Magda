<button id="eafpbot-btn" aria-label="Abrir chat"><svg viewBox="0 0 32 32"><path d="M16 3C8.8 3 3 8.6 3 15.6c0 2.5.7 4.8 2 6.8L3.5 29l6.8-1.8c1.8 1 3.8 1.5 5.7 1.5 7.2 0 13-5.6 13-12.6S23.2 3 16 3zm0 23.4c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-4 1.1 1.1-3.9-.3-.4c-1-1.6-1.6-3.5-1.6-5.4C5.7 10.1 10.3 5.6 16 5.6s10.3 4.5 10.3 10.1S21.7 26.4 16 26.4zm5.7-7.6c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6l-1-2.3c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.7s1.2 3.1 1.4 3.4c.2.2 2.4 3.6 5.8 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.8-.7 2.1-1.4.3-.7.3-1.3.2-1.4-.1-.2-.3-.3-.6-.4z"/></svg></button>
<div id="eafpbot-bubble">¿Te ayudo a elegir tu curso? 👋</div>
<div id="eafpbot-win" role="dialog" aria-label="Chat EAFP">
  <div id="eafpbot-head"><div><b>Asistente EAFP</b><small>Respondemos al instante</small></div><button aria-label="Cerrar">×</button></div>
  <div id="eafpbot-msgs"></div>
  <form id="eafpbot-input"><input placeholder="Escribí tu respuesta..." autocomplete="off"><button>➤</button></form>
</div>
<script>
(function(){
  var C = window.EAFPBOT_CONFIG, L = C.links;
  var win = document.getElementById("eafpbot-win"), msgs = document.getElementById("eafpbot-msgs"),
      form = document.getElementById("eafpbot-input"), inp = form.querySelector("input"),
      bubble = document.getElementById("eafpbot-bubble");
  document.getElementById("eafpbot-head").style.background = C.colorOscuro;
  form.querySelector("button").style.background = C.colorPrincipal;
  var datos = {nombre:"", tema:""}, esperando = null, iniciado = false;

  function abrir(){ win.classList.add("open"); bubble.style.display="none"; if(!iniciado){iniciado=true; inicio();} }
  document.getElementById("eafpbot-btn").onclick = function(){ win.classList.contains("open") ? win.classList.remove("open") : abrir(); };
  bubble.onclick = abrir;
  win.querySelector("#eafpbot-head button").onclick = function(){ win.classList.remove("open"); };

  function msg(texto, quien){
    var d = document.createElement("div");
    d.className = "eafpbot-m " + (quien==="user" ? "eafpbot-user" : "eafpbot-bot");
    if (quien==="user") d.style.background = C.colorPrincipal;
    d.textContent = texto; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function bot(texto, opciones, delay){
    setTimeout(function(){ msg(texto,"bot"); if(opciones) opts(opciones); }, delay===undefined?350:delay);
  }
  function opts(lista){
    var w = document.createElement("div"); w.className = "eafpbot-opts";
    lista.forEach(function(o){
      var el;
      if (o.url){ el=document.createElement("a"); el.href=o.url; el.target="_blank"; el.rel="noopener"; }
      else { el=document.createElement("button"); el.type="button";
        el.onclick=function(){ w.remove(); msg(o.t,"user"); o.go(); }; }
      el.textContent = o.t;
      if (o.wa) el.className = "wa"; else { el.style.borderColor=C.colorPrincipal; el.style.color=C.colorPrincipal; }
      w.appendChild(el);
    });
    msgs.appendChild(w); msgs.scrollTop = msgs.scrollHeight;
  }
  function wa(tema){
    var texto = "Hola! " + (datos.nombre ? "Soy " + datos.nombre + ". " : "") +
                "Vengo de la web y quiero información sobre: " + tema;
    return "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(texto);
  }
  function volver(){ return {t:"⬅ Menú principal", go:menu}; }
  function asesor(tema){ return {t:"💬 Hablar con un asesor", wa:true, url:wa(tema)}; }

  function inicio(){
    bot("¡Hola! 👋 Soy el asistente de la Escuela Argentina de Finanzas Personales.", null, 200);
    bot("¿Cómo te llamás?", null, 700);
    setTimeout(function(){ esperando="nombre"; form.classList.add("show"); inp.focus(); }, 750);
  }
  form.onsubmit = function(e){
    e.preventDefault(); var v = inp.value.trim(); if(!v) return;
    msg(v,"user"); inp.value="";
    if (esperando==="nombre"){ datos.nombre = v.split(" ")[0]; esperando=null; form.classList.remove("show"); menu(true); }
  };

  function menu(primeraVez){
    bot((primeraVez ? "¡Un gusto, " + datos.nombre + "! " : "") + "¿En qué te puedo ayudar?", [
      {t:"🌱 Quiero empezar a invertir", go:nivelInicial},
      {t:"📈 Ya invierto, quiero avanzar", go:nivelAvanzado},
      {t:"🎥 En vivo vs On demand", go:modalidades},
      {t:"📦 Packs", go:packs},
      {t:"💳 Precios y formas de pago", go:pagos},
      {t:"🏢 Para empresas", go:empresas},
      {t:"🎁 Recurso gratis", go:gratis},
      asesor("asesoramiento general")
    ]);
  }
  function nivelInicial(){
    bot("¡Excelente decisión! 🙌 Tenemos cursos pensados para quien arranca de cero: aprendés a ordenar tus finanzas y a hacer tu primera inversión paso a paso.");
    bot("¿Cómo preferís cursar?", [
      {t:"🎥 En vivo (con profesor)", url:L.enVivo},
      {t:"⏯ On demand (a mi ritmo)", url:L.onDemand},
      asesor("cursos para principiantes"), volver()
    ], 900);
  }
  function nivelAvanzado(){
    bot("¡Genial! 🚀 Tenemos cursos para cada nivel, para que pases de tu primera inversión a tu propia estrategia.");
    bot("Un asesor te puede recomendar el curso ideal según lo que ya sabés:", [
      asesor("cursos de nivel intermedio / avanzado"),
      {t:"Ver cursos en vivo", url:L.enVivo}, {t:"Ver cursos on demand", url:L.onDemand}, volver()
    ], 900);
  }
  function modalidades(){
    bot("🎥 EN VIVO: clases online con profesor, en días y horarios fijos, podés hacer preguntas en el momento.\n\n⏯ ON DEMAND: clases grabadas, las ves cuando quieras y a tu ritmo.", [
      {t:"Ver en vivo", url:L.enVivo}, {t:"Ver on demand", url:L.onDemand}, asesor("diferencias entre cursos en vivo y on demand"), volver()
    ]);
  }
  function packs(){
    bot("📦 Los packs combinan varios cursos a un mejor precio que comprarlos por separado.", [
      {t:"Ver packs", url:L.packs}, asesor("packs de cursos"), volver()
    ]);
  }
  function pagos(){
    bot("💳 Podés pagar en 3 cuotas sin interés o con 10% OFF por transferencia.", [
      asesor("precios y formas de pago"), volver()
    ]);
  }
  function empresas(){
    bot("🏢 Ofrecemos capacitación en finanzas personales para equipos de trabajo. Contanos cuántas personas son y te armamos una propuesta.", [
      {t:"Ver propuesta empresas", url:L.empresas}, asesor("capacitación para empresas"), volver()
    ]);
  }
  function gratis(){
    bot("🎁 Tenemos un recurso gratuito para que empieces hoy mismo.", [
      {t:"Descargar recurso gratis", url:L.gratis}, volver()
    ]);
  }
  setTimeout(function(){ if(!iniciado) bubble.style.display="block"; }, 100);
})();
</script>
